
<div class="w-full">
  <!-- Etiqueta del campo -->
  @if (label()) {
    <label
      [for]="name()"
      class="mb-2 block text-sm font-semibold text-slate-900"
    >
      {{ label() }}
    </label>
  }

  <!-- Contenedor del campo -->
  <div class="relative">
    @if (icon() !== 'none') {
      <div
        class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-500"
      >
        @if (icon() === 'user') {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 21a8 8 0 0 0-16 0" />
            <circle cx="12" cy="8" r="4" />
          </svg>
        }

        @if (icon() === 'lock') {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        }
      </div>
    }

    <input
      [id]="name()"
      [name]="name()"
      [type]="type()"
      [placeholder]="placeholder()"
      [class.pl-10]="icon() !== 'none'"
      class="h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-900 outline-none transition-colors focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/15"
    />
  </div>
</div>
